</head>
<body>

<nav class="navbar">

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>

        <li><a href="products.html">Products</a></li>
        <li><a href="#" class="active">Contact Us</a></li>

                <img src="img/Test Account.png" alt="Profile">
            </a>

</nav>

<section class="text-gray-600 body-font relative">
  <div class="container px-5 py-24 mx-auto">
    <div class="flex flex-col text-center w-full mb-12">
      <h1 class="sm:text-3xl text-2xl font-medium title-font mb-4 text-gray-900">CONTACT US</h1>
      <p class="lg:w-2/3 mx-auto leading-relaxed text-base">Feel free to ask us for order and customization inquiries below.</p>
    </div>
    <div class="lg:w-1/2 md:w-2/3 mx-auto">
      <div class="flex flex-wrap -m-2">
        <div class="p-2 w-1/2">
          <div class="relative">
            <label for="name" class="leading-7 text-sm text-gray-600">Name</label>
            <input type="text" id="name" name="name" class="w-full bg-gray-100 bg-opacity-50 rounded border border-gray-300 focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
          </div>
        </div>
        <div class="p-2 w-1/2">
          <div class="relative">
            <label for="email" class="leading-7 text-sm text-gray-600">Email</label>
            <input type="email" id="email" name="email" class="w-full bg-gray-100 bg-opacity-50 rounded border border-gray-300 focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
          </div>
        </div>
        <div class="p-2 w-full">
          <div class="relative">
            <label for="message" class="leading-7 text-sm text-gray-600">Message</label>
            <textarea id="message" name="message" class="w-full bg-gray-100 bg-opacity-50 rounded border border-gray-300 focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-200 h-32 text-base outline-none text-gray-700 py-1 px-3 resize-none leading-6 transition-colors duration-200 ease-in-out"></textarea>
          </div>
        </div>
        <div class="p-2 w-full">
          <button class="flex mx-auto text-white bg-[#1d3557] border-0 py-2 px-8 focus:outline-none hover:bg-[#294b75] transition-colors duration-100 ease-in-out rounded text-lg">Send</button>
        </div>
      </div>
    </div>
  </div>
</section>

        <div class="container px-5 py-8 mx-auto flex items-center sm:flex-row flex-col">
            <a href="index.html" class="logo">TinyToons</a>

                © 2026 TinyToons
            </p>

            <div class="flex items-center gap-3 sm:ml-auto mt-4 sm:mt-0 text-gray-500">

                <a href="https://www.facebook.com/profile.php?id=61596061757479" target="_blank" rel="noopener" aria-label="Facebook">
                    <svg fill="currentColor" class="w-5 h-5" viewBox="0 0 24 24">

                <a href="https://www.youtube.com/@tinytoons2026mj" target="_blank" rel="noopener" aria-label="YouTube">

                </a>

                <a href="https://www.instagram.com/tinytoons2026mj/" target="_blank" rel="noopener" aria-label="Instagram">
                    <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" class="w-5 h-5" viewBox="0 0 24 24">
                        <rect width="20" height="20" x="2" y="2" rx="5" ry="5"></rect>
